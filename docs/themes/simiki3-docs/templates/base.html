<!doctype html>
<html lang="{{ page.lang or 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="{{ page.description or site.description }}">
    <link rel="stylesheet" href="{{ site.root_url }}/static/css/style.css">
    <link rel="alternate" type="application/atom+xml" href="{{ site.root_url }}/atom.xml" title="Atom feed">
    <title>{% block title %}{{ site.title }}{% endblock %}</title>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="{{ site.root_url }}/">
          <span class="brand-mark">S3</span>
          <span>Simiki3</span>
        </a>
        <nav class="top-nav" aria-label="Language navigation">
          <a href="{{ site.root_url }}/en/index.html">English</a>
          <a href="{{ site.root_url }}/zh/index.html">中文</a>
          <a class="github-link" href="https://github.com/hmgle/simiki3">GitHub</a>
        </nav>
      </div>
    </header>
    {% block container %}{% endblock %}
    <footer class="site-footer">
      <div class="footer-inner">
        <span>Simiki3 · Python 3 static wiki generator</span>
        <span><a href="https://github.com/hmgle/simiki3">Open source on GitHub</a> · <a href="{{ site.root_url }}/atom.xml">Atom feed</a></span>
      </div>
    </footer>
  </body>
</html>
