<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{ page.title }} - {{ site.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="{{ site.root }}/static/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <h1><a href="{{ site.root }}/index.html">{{ site.title }}</a></h1>
      {% if site.description %}<p class="site-tagline">{{ site.description }}</p>{% endif %}
    </header>
    <main class="page-content">
      <article>
        <h2>{{ page.title }}</h2>
        <div class="page-meta">
          {% if page.date %}<span>{{ page.date }}</span>{% endif %}
          {% if page.category %}<span>{{ page.category }}</span>{% endif %}
        </div>
        <div class="page-body">
          {{ page.content | safe }}
        </div>
      </article>
    </main>
    <footer class="site-footer">
      <p>Generated by Simiki3.</p>
    </footer>
  </body>
</html>
